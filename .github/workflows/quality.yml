name: Quality
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Tests and offline build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci
      - name: Test interpreter, curriculum, controller and rendering contracts
        run: npm test
      - name: Build the offline app and standalone review
        run: npm run build && node scripts/package-review.mjs
      - name: Verify actual build and portable integrity
        run: node scripts/verify-build.mjs
